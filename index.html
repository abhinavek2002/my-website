<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light">

  <div id="sidebar">
    <button id="toggleBtn">&#9776;</button>
    <div class="nav-item" onclick="showPage('home', this)">
      <span class="icon">🏠</span>
      <span class="label">Home</span>
    </div>
    <div class="nav-item" onclick="showPage('messages', this)">
      <span class="icon">✉️</span>
      <span class="label">Messages</span>
    </div>
    <div class="nav-item" onclick="showPage('settings', this)">
      <span class="icon">⚙️</span>
      <span class="label">Settings</span>
    </div>
  </div>

  <div id="wrapper">
    <div id="header">
      <span id="pageTitle">Home</span>
      <div id="userMenu">
        <button id="userBtn">👤 User ▾</button>
        <div id="dropdown">
          <div class="dropdown-item">⚙️ Settings</div>
          <div class="dropdown-item">🚪 Logout</div>
        </div>
      </div>
      <button id="themeBtn">🌙 Dark</button>
    </div>

    <div id="main">
      <div id="home" class="page">
        <h1>Welcome</h1>
        <p>My name is Abhinav and i would like to this.</p>
      </div>
      <div id="messages" class="page">
        <h1>Messages</h1>
        <p>Your messages will appear here.</p>
      </div>
      <div id="settings" class="page">
        <h1>Settings</h1>
        <p>Your settings will appear here.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
